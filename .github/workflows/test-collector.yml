name: Polymarket Weather Lab

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Selecciona que ejecutar"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - calibration
          - both

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:

  # ==========================================================
  # NORMAL WEATHER PIPELINE
  # Collector + Edge Engine
  # ==========================================================

  normal:
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.mode == 'normal' ||
      github.event.inputs.mode == 'both'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Weather Collector V10.2.1
        run: |
          python collector.py

      - name: Run Edge Engine V1.3
        run: |
          python edge_engine.py

      - name: Commit collected data and edge results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new data or edge results to commit"
          else
            git commit -m "data: weather and edge snapshot $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi


  # ==========================================================
  # HISTORICAL CALIBRATION BOOTSTRAP
  # Manual only
  # ==========================================================

  calibration:
    if: >
      github.event_name == 'workflow_dispatch' &&
      (
        github.event.inputs.mode == 'calibration' ||
        github.event.inputs.mode == 'both'
      )

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Calibration Bootstrap V1.0
        run: |
          python calibration_bootstrap.py

      - name: Commit calibration data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/edge/calibration/

          if git diff --cached --quiet; then
            echo "No new calibration data to commit"
          else
            git commit -m "data: calibration bootstrap $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
