name: Polymarket Weather Lab

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Selecciona el proceso a ejecutar"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - calibration
          - station_observations
          - localize
          - station_calibration
          - both

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:

  normal:
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.mode == 'normal' ||
      github.event.inputs.mode == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Weather Collector V10.2.1
        run: python collector.py

      - name: Run Calibrated Edge Engine V1.6
        run: python edge_engine_v16.py

      - name: Run Paper Trader V1.1
        run: python paper_trader.py

      - name: Commit normal pipeline and paper ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new normal pipeline data"
          else
            git commit -m "data: weather edge and paper trial snapshot $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi

  calibration:
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.mode == 'calibration' || github.event.inputs.mode == 'both')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Calibration Bootstrap V1.1
        run: python calibration_bootstrap.py
      - name: Commit calibration data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edge/calibration/
          if git diff --cached --quiet; then
            echo "No new calibration data"
          else
            git commit -m "data: forecast calibration bootstrap $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi

  station_observations:
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.mode == 'station_observations' || github.event.inputs.mode == 'both')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Station Observation Bootstrap V1.0
        run: python station_observation_bootstrap.py
      - name: Commit station observation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edge/calibration/
          if git diff --cached --quiet; then
            echo "No new station observation data"
          else
            git commit -m "data: station observation bootstrap $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi

  localize:
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.mode == 'localize'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Station Observation Localizer V1.0
        run: python station_observation_localize.py
      - name: Commit localized station data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edge/calibration/
          if git diff --cached --quiet; then
            echo "No new localized station data"
          else
            git commit -m "data: localize station observations $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi

  station_calibration:
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.mode == 'station_calibration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Station Calibration Builder V1.0
        run: python station_calibration_builder.py
      - name: Commit station calibration data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edge/calibration/
          if git diff --cached --quiet; then
            echo "No new station calibration data"
          else
            git commit -m "data: station calibration results $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
