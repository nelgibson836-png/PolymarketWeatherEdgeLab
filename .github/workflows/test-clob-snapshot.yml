name: CLOB Snapshot Unit Tests

on:
  push:
    paths:
      - "clob_snapshot.py"
      - "tests/test_clob_snapshot.py"
      - ".github/workflows/test-clob-snapshot.yml"
  pull_request:
    paths:
      - "clob_snapshot.py"
      - "tests/test_clob_snapshot.py"
      - ".github/workflows/test-clob-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-clob-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install requests
      - name: Run CLOB snapshot tests
        run: python tests/test_clob_snapshot.py
